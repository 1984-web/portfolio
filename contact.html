      <h1>Contact</h1>
      <p>Heb je een vraag, wil je meer weten over mijn projecten of contact met mij 
opnemen? Stuur mij gerust een bericht.</p>

   
<form action="https://tm-statweb.be/forms.php" method="post" class="contact-form">

    <div class="mb-3">
        <label for="naam" class="form-label">Volledige naam:</label>
        <input type="text" class="form-control" id="naam"
               name="naam" required>
    </div>

    <div class="mb-3">
        <label for="emailadress" class="form-label">E-mailadres:</label>
        <input type="email" class="form-control" id="emailadress"
               name="mail" required>
    </div>

    <div class="mb-3">
        <label for="vaardigheid" class="form-label">
            Waarover wil je meer weten?
        </label>

        <select class="form-select" id="vaardigheid" name="vaardigheid" required>
            <option value="" selected disabled>Kies een onderwerp</option>
            <option value="programmeren">Programmeren</option>
            <option value="webdesign">Webdesign</option>
            <option value="grafisch ontwerp">Grafisch ontwerp</option>
            <option value="projecten">Mijn projecten</option>
            <option value="andere">Andere</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="bericht" class="form-label">Je vraag of bericht:</label>
        <textarea class="form-control" id="bericht"
                  name="berichtvanmij" rows="6" required></textarea>
    </div>

    <button type="submit" class="btn custom-btn">Verstuur</button>

</form>
